name: Release

# Pushing a tag like v2.12.1 builds the extension and publishes a GitHub
# release with the matching CHANGELOG section as its notes.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tag must match the manifest version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected tag: $TAG"; exit 1; }
          v="$(node -p "require('./src/manifest.json').version")"
          test "v$v" = "$TAG" || { echo "manifest.json is $v but the tag is $TAG"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Release notes from CHANGELOG.md
        run: |
          # Everything between "## VERSION" and the next "## " heading.
          awk -v v="$VERSION" '
            index($0, "## " v) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Không có mục CHANGELOG cho $VERSION; hãy thêm trước khi tạo tag." > notes.md
          fi
          {
            echo
            echo "## Cài đặt"
            echo
            echo "**Chrome / Brave / Edge**: tải \`docusave-v${VERSION}.zip\`, giải nén, mở \`chrome://extensions\`, bật Developer mode, chọn Load unpacked và chọn thư mục vừa giải nén."
            echo
            echo "**Firefox**: tải \`docusave-v${VERSION}.zip\`, giải nén, mở \`about:debugging#/runtime/this-firefox\`, bấm Load Temporary Add-on và chọn \`manifest.json\` trong thư mục vừa giải nén."
            echo
            echo "Bản phát hành chỉ có file zip; không kèm \`.xpi\`."
            echo
            echo "Xem README để biết hướng dẫn đầy đủ."
          } >> notes.md
          cat notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "DocuSave $TAG" \
            --notes-file notes.md \
            "dist/docusave-v${VERSION}.zip"
